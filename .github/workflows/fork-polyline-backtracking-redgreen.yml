# Fork-only CI: not part of the upstream change.
# This file was generated with the assistance of an AI coding tool.
# Builds IfcOpenShell at two exact commits and runs the geometry volume
# regression tests: "red" = test only on the base, "green" = test + fix.
name: Fork polyline back-tracking RED/GREEN

permissions: {}

on:
  pull_request:
  workflow_dispatch:

jobs:
  redgreen:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: red
            sha: f95953676221fa8f84754e34c942c9b3a582c453
          - lane: green
            sha: 0e19446f0a195851a867e220062148ecf4a7f48b
    name: ${{ matrix.lane }} (${{ matrix.sha }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Record tree
        run: |
          git log -1 --format='%H %s'
          grep -n 'remove_backtracking_points_from_loop' src/ifcgeom/mapping/IfcPolyline.cpp || echo "no fix in tree"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xmlschema xsdata numpy lxml pytest isodate lark networkx tabulate python-dateutil shapely pyparsing psutil

      - name: Install C++ dependencies
        run: |
          sudo apt update
          OCCT_CMAKE_DEPS="occt-misc libocct-draw-dev tcl-dev tk-dev libxi-dev"
          sudo apt-get install --no-install-recommends -y \
          git cmake ninja-build gcc g++ \
          libboost-iostreams-dev \
          libboost-program-options-dev \
          libboost-regex-dev \
          libpcre3-dev libxml2-dev \
          libtbb-dev nlohmann-json3-dev \
          libocct-foundation-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libocct-data-exchange-dev \
          ${OCCT_CMAKE_DEPS} \
          libsqlite3-dev sqlite3 \
          libcgal-dev libeigen3-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fork-polyline-redgreen-${{ matrix.lane }}

      - name: Build swig
        run: |
          sudo apt remove --purge -y swig swig4.0 || true
          sudo apt-get install -y libpcre2-dev bison
          git clone https://github.com/swig/swig --branch v4.2.1 --depth 1
          cd swig && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . --target install -j $(nproc)

      - name: Build ifcopenshell
        run: |
          mkdir build && cd build
          cmake ../cmake \
               -G Ninja \
               -DCMAKE_BUILD_TYPE=Release \
               -DPYTHON_EXECUTABLE:FILEPATH=$(which python) \
               -DPYTHON_INCLUDE_DIR:PATH=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") \
               -DUSE_MMAP=On \
               -DUSE_CCACHE=ON \
               -DBUILD_ONLY_COMMON_SCHEMAS=ON \
               -DCOLLADA_SUPPORT=Off \
               -DBUILD_EXAMPLES=Off \
               -DBUILD_CONVERT=Off \
               -DBUILD_GEOMSERVER=Off
          sudo cmake --build . --target install -j $(nproc)

      - name: Run geometry volume regression tests
        run: |
          cd src/ifcopenshell-python/test
          python -c "import ifcopenshell; print(ifcopenshell.__file__, ifcopenshell.version)"
          set +e
          pytest --import-mode=importlib -p no:pytest-blender -v geom/test_volume_regressions.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$status"
          echo "### ${{ matrix.lane }} ${{ matrix.sha }} pytest exit $status" >> "$GITHUB_STEP_SUMMARY"
          grep -E '10024|passed|failed' pytest.log | tail -20 >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.lane }}" = red ]; then
            # Expect exactly the two spike cases to fail on the base.
            grep -q 'test_opening_profile_with_backtracking_point_10024\[spike-wire_check\] FAILED' pytest.log || exit 1
            grep -q 'test_opening_profile_with_backtracking_point_10024\[spike-no_wire_check\] FAILED' pytest.log || exit 1
            grep -q 'test_opening_profile_with_backtracking_point_10024\[clean-wire_check\] PASSED' pytest.log || exit 1
            grep -q 'test_opening_profile_with_backtracking_point_10024\[clean-no_wire_check\] PASSED' pytest.log || exit 1
            grep -q ' 2 failed' pytest.log || exit 1
            echo "RED as expected"
          else
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.lane }}
          path: src/ifcopenshell-python/test/pytest.log
