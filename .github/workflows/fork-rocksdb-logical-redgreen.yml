# Fork-only CI: not part of the upstream change.
# This file was generated with the assistance of an AI coding tool.
# Builds IfcOpenShell with RocksDB at two exact commits and runs the
# RocksDB pytest file: "red" = test only on the base, "green" = test + fix.
name: Fork RocksDB logical RED/GREEN

permissions: {}

on:
  pull_request:
  workflow_dispatch:

jobs:
  redgreen:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: red
            sha: 48cee1f3c676689ed65b77ad49eea466ea9c3160
          - lane: green
            sha: 03d441d89d55ead88712f7d5341006890fe0c05e
    name: ${{ matrix.lane }} (${{ matrix.sha }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Record tree
        run: |
          git log -1 --format='%H %s'
          grep -n 'char tt = ' src/ifcparse/entity_instance_data.cpp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xmlschema xsdata numpy lxml pytest isodate lark networkx tabulate python-dateutil shapely pyparsing psutil

      - name: Install C++ dependencies
        run: |
          sudo apt update
          OCCT_CMAKE_DEPS="occt-misc libocct-draw-dev tcl-dev tk-dev libxi-dev"
          sudo apt-get install --no-install-recommends -y \
          git cmake ninja-build gcc g++ \
          libboost-iostreams-dev \
          libboost-program-options-dev \
          libboost-regex-dev \
          libpcre3-dev libxml2-dev \
          libtbb-dev nlohmann-json3-dev \
          libocct-foundation-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libocct-data-exchange-dev \
          ${OCCT_CMAKE_DEPS} \
          libsqlite3-dev sqlite3 \
          libcgal-dev libeigen3-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fork-redgreen-${{ matrix.lane }}

      - name: Build rocksdb
        run: |
          git clone https://github.com/facebook/rocksdb --branch v9.11.2 --depth 1
          cd rocksdb
          mkdir build && cd build
          cmake .. -G Ninja -DFAIL_ON_WARNINGS=Off -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DWITH_TESTS=OFF -DWITH_TOOLS=OFF \
            -DWITH_GFLAGS=OFF -DWITH_BENCHMARK_TOOLS=OFF -DWITH_CORE_TOOLS=OFF \
            -DWITH_TRACE_TOOLS=OFF -DROCKSDB_BUILD_SHARED=Off -DPORTABLE=1 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=On -DUSE_RTTI=On
          sudo cmake --build . --target install -j $(nproc)

      - name: Build swig
        run: |
          sudo apt remove --purge -y swig swig4.0 || true
          sudo apt-get install -y libpcre2-dev bison
          git clone https://github.com/swig/swig --branch v4.2.1 --depth 1
          cd swig && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . --target install -j $(nproc)

      - name: Build ifcopenshell
        run: |
          mkdir build && cd build
          cmake ../cmake \
               -G Ninja \
               -DCMAKE_BUILD_TYPE=Release \
               -DPYTHON_EXECUTABLE:FILEPATH=$(which python) \
               -DPYTHON_INCLUDE_DIR:PATH=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") \
               -DUSE_MMAP=On \
               -DUSE_CCACHE=ON \
               -DBUILD_ONLY_COMMON_SCHEMAS=ON \
               -DWITH_ROCKSDB=On \
               -DCOLLADA_SUPPORT=Off \
               -DBUILD_EXAMPLES=Off \
               -DBUILD_CONVERT=Off \
               -DBUILD_GEOMSERVER=Off
          sudo cmake --build . --target install -j $(nproc)

      - name: Run RocksDB pytest files
        run: |
          cd src/ifcopenshell-python/test
          python -c "import ifcopenshell; print(ifcopenshell.__file__, ifcopenshell.version)"
          set +e
          pytest --import-mode=importlib -p no:pytest-blender -v test_streaming_rocksdb_and_simpletyperefs.py test_validate_rocksdb.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$status"
          echo "### ${{ matrix.lane }} ${{ matrix.sha }} pytest exit $status" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASSED|FAILED)|::test_rocks_logical_roundtrip|passed|failed' pytest.log | tail -20 >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.lane }}" = red ]; then
            # Expect exactly the UNKNOWN case to fail on the base.
            grep -q 'FAILED test_streaming_rocksdb_and_simpletyperefs.py::test_rocks_logical_roundtrip\[UNKNOWN\]' pytest.log || exit 1
            grep -q 'test_rocks_logical_roundtrip\[True\] PASSED' pytest.log || exit 1
            grep -q 'test_rocks_logical_roundtrip\[False\] PASSED' pytest.log || exit 1
            echo "RED as expected"
          else
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.lane }}
          path: src/ifcopenshell-python/test/pytest.log
