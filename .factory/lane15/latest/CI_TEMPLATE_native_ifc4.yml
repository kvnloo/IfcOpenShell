# This file was generated with the assistance of an AI coding tool.
# REVIEW-ONLY. This file lives in .factory/lane15/latest/ and is INACTIVE.
# workflow_dispatch requires the workflow to be installed on the default branch.
# Do not install or enable without human approval; never copy to origin.
name: Lane 15 IFC4 native metres-millimetres proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ifc4-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify checkout contains the recovery snapshot
        run: |
          test -f .factory/lane15/latest/runtime_gate.py
          test -f .factory/lane15/latest/benchmarks/small_residence/single_zone.usda
      - name: Install real geometry and USD runtimes
        run: |
          python -m pip install 'ifcopenshell==0.9.0' 'usd-core==26.5'
          python -m pip freeze > native-dependencies.txt
          python - <<'PY'
          import ifcopenshell
          import ifcopenshell.geom
          from pxr import Usd
          print('IfcOpenShell version:', ifcopenshell.version)
          print('OpenUSD version:', Usd.GetVersion())
          PY
      - name: Run core regression and actual IFC + USDA gates
        working-directory: .factory/lane15/latest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          PYTHONPATH=baseline:. python -m unittest discover -s . -p 'test_*.py' -q \
            2>&1 | tee reports/unittest.log
          set +e
          PYTHONPATH=baseline:. python runtime_gate.py \
            benchmarks/small_residence benchmarks/field_clinic benchmarks/workshop \
            --author-ifc --ifc-units both --require-native-ifc \
            --report reports/native-ifc4-and-usda.json 2>&1 | tee reports/native.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > reports/native.exit
          # Strictly check OpenUSD separately. IFC PASS does not imply USD PASS.
          if [ "$code" -eq 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('reports/native-ifc4-and-usda.json').read_text())
          failures = [case['building'] for case in data['cases']
                      if case['real_openusd_stage']['status'] != 'PASS']
          if failures:
              raise SystemExit('OpenUSD native stage failed/not run: ' + ', '.join(failures))
          print('OpenUSD native stage verified for all fixtures (not EnergyPlus)')
          PY
          fi
          exit "$code"
      - name: Keep reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane15-native-ifc4-mm
          path: |
            native-dependencies.txt
            .factory/lane15/latest/reports/
            .factory/lane15/latest/benchmarks/*/ifc_runtime/
          if-no-files-found: warn
